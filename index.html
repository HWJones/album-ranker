<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11151b"><title>My Albums of 2026</title><style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark;--bg:#11151b;--card:#1d2430;--line:#34404f;--ink:#f6f8fb;--muted:#bdc6d2;--lime:#d1f598}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);padding:0 0 calc(55px + env(safe-area-inset-bottom))}main{max-width:800px;margin:auto;padding:18px 12px}h1{font-size:clamp(27px,7vw,42px);letter-spacing:-.045em;margin:8px 0}p{color:var(--muted);line-height:1.45;margin:7px 0 16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:15px 0 18px}button{font:inherit;color:var(--ink);background:#283340;border:1px solid #495767;border-radius:10px;cursor:pointer;min-height:44px;padding:9px 12px;font-weight:650}button:disabled{opacity:.33;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid var(--lime);outline-offset:2px}.primary{color:#17210e;background:var(--lime);border-color:var(--lime)}.count{margin-left:auto;color:var(--muted);font-size:13px}.list{display:flex;flex-direction:column;gap:9px}.item{display:grid;grid-template-columns:30px 66px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px}.number{color:var(--lime);font-size:17px;font-weight:800;text-align:center}.art{width:66px;height:66px;object-fit:cover;border-radius:8px;background:linear-gradient(145deg,#455063,#252c3b)}.fallback{display:grid;place-items:center;color:#dce4e9;font-weight:bold;font-size:22px}.info{min-width:0}.artist{font-weight:750;font-size:15px;overflow-wrap:anywhere}.album{color:var(--muted);font-size:13px;margin-top:3px;overflow-wrap:anywhere}.controls{display:flex;gap:5px}.move{width:40px;min-width:40px;min-height:44px;padding:0;font-size:20px}.item.dragging{opacity:.45}.item.dragover{outline:2px solid var(--lime)}.note{margin:15px 2px;font-size:12px}.download{display:none}@media(max-width:430px){.item{grid-template-columns:24px 56px minmax(0,1fr) auto;gap:7px;padding:7px}.art{width:56px;height:56px}.artist{font-size:13px}.album{font-size:12px}.move{width:34px;min-width:34px;min-height:42px;font-size:18px}.controls{gap:3px}.number{font-size:14px}}@media(prefers-reduced-motion:no-preference){.item{transition:background .15s}}
</style></head><body><main><h1>My Albums of 2026</h1><p>All 33 albums, already in a shuffled order. Move them up or down to build your ranking. Your order saves automatically on this device.</p><div class="toolbar"><button class="primary" id="copy">Copy ranking</button><button id="shuffle">Shuffle again</button><button id="reset">Reset order</button><span class="count">33 albums</span></div><div class="list" id="list" aria-label="Album ranking"></div><p class="note" id="status" role="status">Use the arrow buttons to move albums. On a computer, you can also drag the rows. Album artwork loads when available.</p></main><script>
'use strict';
const albums=[
['Lowly','Softy'],['The Avalanches','No Bad Memories'],['Chase & Status','Generic Everything'],['Carly Rae Jepsen','Day and Night'],['Susanne Sundfør & Kit Downes','Revelations of Divine Love'],['Natalie Imbruglia','Algorithm'],['Julia Jacklin','The Gem'],['Tove Lo','Estrus'],['This Is Lorelei','The Singer in My Band'],['Erykah Badu & The Alchemist','Before the World Blows'],['Phoebe Bridgers','Lost Weekend'],['Kevin Morby','Little Wide Open'],['Nia Archives','Emotional Junglist'],['Robyn','Sexistential'],['Madonna','Confessions II'],['Gem Club','Emerald Press'],['Broken Social Scene','Remember the Humans'],['Aldous Harding','Train on the Island'],['Lykke Li','The Afterparty'],['Holy Fuck','Event Beat'],['hemlocke springs','the apple tree under the sea'],['Agnes','Beautiful Madness'],['Haute & Freddy','Big Disgrace'],['Together Pangea','Eat Myself'],['Grace Ives','Girlfriend'],['The Twilight Sad',"It's the Long Goodbye"],['Harry Styles','Kiss All the Time. Disco, Occasionally.'],['Art School Girlfriend','Lean In'],['Remi Wolf','Mud'],['James Blake','Trying Times'],['Courtney Marie Andrews','Valentine'],['Slayyyter','WOR$T GIRL IN AMERICA'],['Charli xcx','Music, Fashion, Film']
].map(([artist,title],id)=>({id,artist,title}));
const key='album-ranker-2026-all-33-v2';const artKey='album-ranker-2026-artwork-v2';
function shuffle(x){let a=[...x];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let saved;try{saved=JSON.parse(localStorage.getItem(key))}catch{};
let order=Array.isArray(saved)&&saved.length===albums.length&&new Set(saved).size===albums.length&&saved.every(n=>Number.isInteger(n)&&n>=0&&n<albums.length)?saved:shuffle(albums.map(a=>a.id));
let arts={};try{arts=JSON.parse(localStorage.getItem(artKey))||{}}catch{};
const list=document.getElementById('list'),status=document.getElementById('status');
function save(){try{localStorage.setItem(key,JSON.stringify(order))}catch{status.textContent='This browser cannot save progress. Use Copy ranking to keep a copy.'}}
function el(tag,cls,content){const e=document.createElement(tag);if(cls)e.className=cls;if(content!==undefined)e.textContent=content;return e}
function render(){const frag=document.createDocumentFragment();order.forEach((id,i)=>{const a=albums[id],item=el('article','item');item.draggable=true;item.dataset.id=id;item.append(el('span','number',String(i+1)));let cover;if(arts[id]){cover=el('img','art');cover.src=arts[id];cover.alt='';cover.loading='lazy';cover.onerror=()=>{cover.replaceWith(el('div','art fallback','♫'))}}else cover=el('div','art fallback','♫');item.append(cover);const info=el('div','info');info.append(el('div','artist',a.artist),el('div','album',a.title));item.append(info);const controls=el('div','controls');[['↑',-1,'Move up'],['↓',1,'Move down']].forEach(([symbol,delta,label])=>{const btn=el('button','move',symbol);btn.type='button';btn.setAttribute('aria-label',`${label}: ${a.artist}, ${a.title}`);btn.disabled=(delta===-1&&i===0)||(delta===1&&i===order.length-1);btn.onclick=()=>{const k=order.indexOf(id),m=k+delta;if(m<0||m>=order.length)return;[order[k],order[m]]=[order[m],order[k]];save();render();const newBtn=list.querySelector(`[data-id="${id}"] .move:nth-child(${delta===-1?1:2})`);newBtn?.focus({preventScroll:true});};controls.append(btn)});item.append(controls);item.addEventListener('dragstart',e=>{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',String(id));item.classList.add('dragging')});item.addEventListener('dragend',()=>{item.classList.remove('dragging');document.querySelectorAll('.dragover').forEach(e=>e.classList.remove('dragover'))});item.addEventListener('dragover',e=>{e.preventDefault();item.classList.add('dragover')});item.addEventListener('dragleave',()=>item.classList.remove('dragover'));item.addEventListener('drop',e=>{e.preventDefault();item.classList.remove('dragover');const dragged=Number(e.dataTransfer.getData('text/plain'));if(!order.includes(dragged)||dragged===id)return;order.splice(order.indexOf(dragged),1);order.splice(order.indexOf(id),0,dragged);save();render()});frag.append(item)});list.replaceChildren(frag)}
async function artwork(){for(const a of albums){if(arts[a.id])continue;try{const term=encodeURIComponent(a.artist+' '+a.title);const response=await fetch(`https://itunes.apple.com/search?term=${term}&entity=album&limit=12`,{mode:'cors'});if(!response.ok)continue;const data=await response.json();const norm=s=>s.toLowerCase().replace(/[^a-z0-9]/g,'');const exact=data.results?.find(r=>norm(r.artistName||'').includes(norm(a.artist.split(' & ')[0]))&&norm(r.collectionName||'')===norm(a.title));if(exact?.artworkUrl100){arts[a.id]=exact.artworkUrl100.replace('100x100bb','300x300bb');try{localStorage.setItem(artKey,JSON.stringify(arts))}catch{};const row=list.querySelector(`[data-id="${a.id}"]`);if(row){const current=row.querySelector('.art');if(current){const img=el('img','art');img.src=arts[a.id];img.alt='';img.loading='lazy';img.onerror=()=>img.replaceWith(el('div','art fallback','♫'));current.replaceWith(img)}}}}catch{}}}
document.getElementById('copy').onclick=async()=>{const text=order.map((id,i)=>`${i+1}. ${albums[id].artist} - ${albums[id].title}`).join('\n');try{await navigator.clipboard.writeText(text);status.textContent='Your ranking has been copied.'}catch{const blob=new Blob([text],{type:'text/plain'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='albums-2026-ranking.txt';a.click();URL.revokeObjectURL(u);status.textContent='Ranking downloaded as a text file.'}};
document.getElementById('shuffle').onclick=()=>{if(confirm('Shuffle your current ranking?')){order=shuffle(order);save();render()}};
document.getElementById('reset').onclick=()=>{if(confirm('Reset to a new random order?')){order=shuffle(albums.map(a=>a.id));save();render()}};
save();render();artwork();
</script></body></html>
